server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vpn-ui.milad-karami.ir;

    ssl_certificate /etc/letsencrypt/live/vpn-ui.milad-karami.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn-ui.milad-karami.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 302 /DOOM/;
    }

    location /DOOM/ {
        proxy_pass https://127.0.0.1:2053;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name milad-karami.ir www.milad-karami.ir;
    return 301 https://vpn-ui.milad-karami.ir$request_uri;
}
