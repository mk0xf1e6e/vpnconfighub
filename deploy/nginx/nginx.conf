upstream api { server api:3001; }
upstream web { server host.docker.internal:3000; }
upstream admin { server host.docker.internal:3002; }

server {
  listen 80;
  server_name _;
  location /api/ { proxy_pass http://api/; proxy_set_header Host $host; }
  location /admin/ { proxy_pass http://admin/; }
  location / { proxy_pass http://web/; }
}
