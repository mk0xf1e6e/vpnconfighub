services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: vpn
      POSTGRES_DB: vpn_hub
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: { context: .., dockerfile: deploy/docker/api-server.Dockerfile }
    env_file: ../.env
    ports: ["3001:3001"]
    depends_on: [postgres, redis]
  bot:
    build: { context: .., dockerfile: deploy/docker/telegram-bot.Dockerfile }
    env_file: ../.env
    depends_on: [postgres]
  worker:
    build: { context: .., dockerfile: deploy/docker/worker-service.Dockerfile }
    env_file: ../.env
    depends_on: [postgres, redis]
volumes: { pg: {} }
