services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      API_PORT: 4000
      NODE_ENV: production
    networks:
      - vpnhub
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_TELEGRAM_APP_URL: ${NEXT_PUBLIC_TELEGRAM_APP_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_TELEGRAM_APP_URL: ${NEXT_PUBLIC_TELEGRAM_APP_URL:-}
    networks:
      - vpnhub
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  vpnhub:
    name: vpnhub
